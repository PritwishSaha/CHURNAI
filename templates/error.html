{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

<section class="wrap error-page">
    <div>
        <div class="error-code" aria-hidden="true">{{ code }}</div>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <div class="error-actions">
            <a href="{{ url_for('index') }}" class="btn btn-primary">Back to home</a>
            <a href="{{ url_for('predict') }}" class="btn btn-ghost">Score a customer</a>
        </div>
    </div>
</section>

{% endblock %}
